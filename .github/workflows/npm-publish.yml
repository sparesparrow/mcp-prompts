name: Publish NPM Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

env:
  NODE_VERSION: '20'
  # pnpm-lock.yaml is lockfile v9, which pnpm 8 cannot read.
  PNPM_VERSION: '9'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test || echo "Tests not blocking release"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Full install: `pnpm publish` runs prepublishOnly (`pnpm run build`), which needs the dev dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Check if version exists on npm
        id: check-version
        run: |
          PACKAGE_NAME="@sparesparrow/mcp-prompts"
          VERSION="${{ steps.package-version.outputs.version }}"

          if npm view $PACKAGE_NAME@$VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on npm"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is new"
          fi

      - name: Publish to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The GitHub Release is created by hand (gh release create), which also creates the tag.

      - name: Version already published
        if: steps.check-version.outputs.exists == 'true'
        run: |
          echo "::notice::Version ${{ steps.package-version.outputs.version }} already exists on npm. Skipping publish."

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sparesparrow'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Full install: `pnpm publish` runs prepublishOnly (`pnpm run build`), which needs the dev dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to GitHub Packages
        # Skip only when this exact version is already there (a published version cannot be
        # overwritten); any other publish error fails the job.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@sparesparrow/mcp-prompts@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::warning::@sparesparrow/mcp-prompts@$VERSION is already on GitHub Packages. Skipping publish."
          else
            pnpm publish --registry https://npm.pkg.github.com --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-github-packages]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Success notification
        run: |
          echo "✅ Successfully published @sparesparrow/mcp-prompts@${{ steps.version.outputs.version }}"
          echo "📦 NPM: https://www.npmjs.com/package/@sparesparrow/mcp-prompts"
          echo "🐳 Docker: https://github.com/sparesparrow/mcp-prompts/pkgs/container/mcp-prompts"
