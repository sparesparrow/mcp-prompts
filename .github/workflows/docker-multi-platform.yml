name: Multi-Platform Docker Build

# Build check for pull requests: every image variant must build for both
# platforms. Publishing happens in docker-publish.yml.
#
# Each platform builds natively on its own runner. Under QEMU emulation,
# Node crashed during pnpm install on arm64 ("uncaught target signal 4
# (Illegal instruction)") and the job hung until it was cancelled.
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [default, mcp, file]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile${{ matrix.variant != 'default' && format('.{0}', matrix.variant) || '' }}
        platforms: ${{ matrix.platform }}
        push: false
        cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }}
