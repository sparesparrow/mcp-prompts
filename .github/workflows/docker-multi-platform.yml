name: Multi-Platform Docker Build

# Build check for pull requests: every image variant must build for both
# platforms. Publishing happens in docker-publish.yml.
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, mcp, file]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile${{ matrix.variant != 'default' && format('.{0}', matrix.variant) || '' }}
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha,scope=${{ matrix.variant }}
        cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
