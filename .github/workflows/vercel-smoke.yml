name: Vercel deployment smoke test

# Vercel's Deployment Checks wait for "Verify production MCP endpoint" before they promote a
# deployment of main to https://mcp-prompts.vercel.app. The check must not wait for production
# itself (it once did, and production stayed on an old version: Vercel waited for the check, the
# check waited for Vercel). It builds the image Vercel runs (Dockerfile), starts it as production
# does, and checks safe mode, the package version, and every profile over MCP.
# The live URL is checked by vercel-monitor.yml, which runs after Vercel deploys. This workflow
# runs on push only, so no skipped copy of the check ever lands on a commit Vercel is waiting for.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-image:
    name: Verify production MCP endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install smoke-test dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the production image (the Dockerfile Vercel runs)
        run: docker build -t mcp-prompts:candidate .

      - name: Start it as production runs it
        run: |
          set -euo pipefail
          docker run -d --name candidate -p 127.0.0.1:3003:3003 mcp-prompts:candidate
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3003/health >/dev/null && exit 0
            sleep 2
          done
          docker logs candidate
          exit 1

      - name: Check safe runtime mode and version
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:3003/ready -o ready.json
          curl --fail --silent --show-error http://127.0.0.1:3003/version -o version.json
          node -e '
            const r = require("./ready.json");
            const v = require("./version.json");
            const expected = require("./package.json").version;
            const safe = r.status === "ready" && r.readOnly === true && r.auth === "none" && r.storage === "memory";
            if (!safe) { console.error("unsafe runtime mode", r); process.exit(1); }
            if (v.version !== expected) { console.error(`version ${v.version}, expected ${expected}`); process.exit(1); }
            console.log(`read-only, no auth, memory storage, version ${v.version}`);
          '

      - name: Exercise every profile over MCP
        run: |
          set -euo pipefail
          for profile in $(node -p 'Object.keys(require("./data/prompts/profiles.json").profiles).join(" ")'); do
            echo "::group::MCP profile: $profile"
            pnpm exec node deploy/smoke-test.mjs --expect-read-only --max-prompts 20 \
              --url "http://127.0.0.1:3003/mcp?profile=$profile"
            echo "::endgroup::"
          done

      - name: Server log
        if: always()
        run: docker logs candidate 2>&1 | tail -50 || true
