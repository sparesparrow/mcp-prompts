name: 'Run TODO to Issue'
# Manual only: running on every push opened ~58 duplicate issues from // TODO comments.
on: ['workflow_dispatch']
jobs:
  build:
    runs-on: 'ubuntu-latest'
    permissions:
      issues: write
    steps:
      - uses: 'actions/checkout@v4'
      - name: 'TODO to Issue'
        uses: 'alstr/todo-to-issue-action@v5'
